[package]
name = "yaca-desktop"
description = "Yaca — application shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Not `yaca`: that is the name of the `yaca-cli` binary, and in the shared
# `target/debug` they overwrote each other — a built shell silently replaced
# the CLI. The name must differ in case too: files on Windows are
# case-insensitive.
[[bin]]
name = "yaca-desktop"
path = "src/main.rs"

[lib]
# The `_lib` suffix is Tauri's own convention; `main.rs` calls `yaca_lib::run`.
name = "yaca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what lets a window hold a second webview — the browser
# column's page; `devtools` keeps its DevTools in a release build.
tauri = { version = "2", features = ["unstable", "devtools"] }
# Choosing the project folder from the chip in §9.1. The webview has no dialog of its own.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Everything below is the desktop window. A phone's shell holds no host: the
# interface there talks to a `yaca-server`, and none of this (the keychain, the
# shell tools, toasts) has a place on an Android device.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
yaca-core.workspace = true
yaca-host.workspace = true

serde.workspace = true
serde_json.workspace = true
# Toasts §15 — `notify-rust` directly, not a plugin: see the comment in `notify.rs`.
notify-rust = "4.18"
tokio.workspace = true
tokio-util.workspace = true
# `Startup` goes to the webview, like the core's types, and must not drift from them.
ts-rs.workspace = true
async-trait.workspace = true
base64.workspace = true
# The browser's `read_page` as Markdown, the same converter `WebFetch` uses.
htmd.workspace = true

# The browser's engine on Windows talks to WebView2 directly: the versions are
# the ones wry is built on, so the COM types are the same types.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
