[package]
name = "yaca-desktop"
description = "Yaca — оболочка приложения"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Не `yaca`: так зовётся бинарник `yaca-cli`, и в общем `target/debug` они
# затирали друг друга — собранная оболочка молча подменяла CLI. Имя должно
# отличаться и по регистру тоже: на Windows файлы регистронезависимы.
[[bin]]
name = "yaca-desktop"
path = "src/main.rs"

[lib]
# Суффикс `_lib` — соглашение самого Tauri; `main.rs` зовёт `yaca_lib::run`.
name = "yaca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yaca-core.workspace = true

serde.workspace = true
serde_json.workspace = true
# `unstable` is what lets a window hold a second webview — the browser
# column's page; `devtools` keeps its DevTools in a release build.
tauri = { version = "2", features = ["unstable", "devtools"] }
# Выбор папки проекта в чипе §9.1. Своего диалога у вебвью нет.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Тосты §15 — напрямую `notify-rust`, не плагин: см. комментарий в `notify.rs`.
notify-rust = "4.18"
tokio.workspace = true
tokio-util.workspace = true
# `Startup` уезжает в вебвью, как и типы ядра, и разойтись с ним не должен.
ts-rs.workspace = true
async-trait.workspace = true
base64.workspace = true
# The browser's `read_page` as Markdown, the same converter `WebFetch` uses.
htmd.workspace = true

# The browser's engine on Windows talks to WebView2 directly: the versions are
# the ones wry is built on, so the COM types are the same types.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
