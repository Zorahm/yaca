# Release pipeline. Push a tag like v1.0.0-beta to build the installers for
# Windows, macOS and Linux and attach them to one draft GitHub release.
# Review the draft, then publish it by hand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild; leave empty for artifacts only"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: "--bundles nsis"
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: linux
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$RELEASE_TAG" ]; then
            echo "tag $RELEASE_TAG does not match tauri.conf.json version $app" >&2
            exit 1
          fi

      # What Tauri's webview and the keyring (Secret Service over D-Bus) link against.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - run: npm ci

      - run: npm test

      # A tag makes a draft release. A manual run can rebuild an existing tag;
      # without release_tag it only keeps artifacts and creates no release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_INCREMENTAL: 0
          # Signs the updater artifacts and writes the .sig files the app checks
          # before installing. The key itself has no password: the variable is
          # left out rather than set to an empty string.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          releaseName: "Yaca ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Installers for Windows (NSIS), macOS (dmg, Apple silicon and Intel) and Linux (deb, AppImage). The macOS builds are not signed: open them with right click, Open. See the README for what is new."
          releaseDraft: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          # The updater artifacts and `latest.json` are built for CI only: a local
          # build must not need the signing key (see `tauri.updater.conf.json`).
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          # The Windows installer the app installs is the NSIS one.
          updaterJsonPreferNsis: true

      - name: Keep the installers of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
