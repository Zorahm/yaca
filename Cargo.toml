[workspace]
resolver = "2"
members = ["crates/yaca-core", "crates/yaca-cli", "crates/yaca-evals", "src-tauri"]

[workspace.package]
version = "1.0.2-alpha"
authors = ["ZorahM"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yaca-core = { path = "crates/yaca-core" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
htmd = "0.5"
ignore = "0.4"
# Only the formats a model can be sent or a screenshot tool writes: the default
# set pulls in a dozen decoders nothing here would ever meet.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive", "rc"] }
similar = { version = "2", features = ["inline"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_SystemInformation"] }

[profile.dev]
# Ядро пересобирается на каждой правке; зависимости — почти никогда.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
