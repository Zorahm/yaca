[workspace]
resolver = "2"
members = ["crates/yaca-core", "crates/yaca-host", "crates/yaca-server", "crates/yaca-cli", "crates/yaca-evals", "src-tauri"]

[workspace.package]
version = "1.0.0-beta"
authors = ["ZorahM"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yaca-core = { path = "crates/yaca-core" }
yaca-host = { path = "crates/yaca-host" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio"] }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
htmd = "0.5"
ignore = "0.4"
# Only the formats a model can be sent or a screenshot tool writes: the default
# set pulls in a dozen decoders nothing here would ever meet.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
# Text of a PDF for `Read`. Pure Rust: no poppler or other system library to
# install next to the app.
pdf-extract = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive", "rc"] }
similar = { version = "2", features = ["inline"] }
# PKCE (S256) for the OAuth login of remote MCP servers.
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process", "net"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
# Skill headers are YAML written for other clients: block scalars and nested
# `metadata` are common, and a `key: value` reader loses both.
yaml-rust2 = { version = "0.13", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_SystemInformation"] }

[profile.dev]
# The core rebuilds on every edit; dependencies almost never do.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
