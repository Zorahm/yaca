[workspace]
resolver = "2"
members = ["crates/yaca-core", "crates/yaca-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yaca-core = { path = "crates/yaca-core" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
htmd = "0.5"
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
similar = { version = "2", features = ["inline"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "process"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[profile.dev]
# Ядро пересобирается на каждой правке; зависимости — почти никогда.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
